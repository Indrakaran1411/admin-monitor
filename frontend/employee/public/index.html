<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Employee Chat</title>
<script src="https://cdn.socket.io/4.6.1/socket.io.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
body{background:#f5f5f5;height:100vh;display:flex;flex-direction:column}
.header{background:#534AB7;color:#fff;padding:12px 16px;display:flex;align-items:center;justify-content:space-between}
.header h1{font-size:16px;font-weight:500}
.header-right{font-size:12px;opacity:0.8}
.login-wrap{flex:1;display:flex;align-items:center;justify-content:center;padding:20px}
.login-card{background:#fff;border-radius:12px;padding:24px;width:100%;max-width:340px;box-shadow:0 2px 12px rgba(0,0,0,0.08)}
.login-card h2{font-size:18px;font-weight:500;margin-bottom:4px}
.login-card p{font-size:13px;color:#666;margin-bottom:20px}
.form-group{margin-bottom:14px}
.form-group label{font-size:12px;color:#555;display:block;margin-bottom:4px}
.form-group input,.form-group select{width:100%;padding:9px 12px;border:1px solid #ddd;border-radius:8px;font-size:14px;outline:none}
.form-group input:focus{border-color:#534AB7}
.btn{width:100%;padding:10px;background:#534AB7;color:#fff;border:none;border-radius:8px;font-size:14px;cursor:pointer;margin-top:4px}
.btn:hover{background:#3C3489}
.btn-outline{background:#fff;color:#534AB7;border:1px solid #534AB7;margin-top:8px}
.error{color:#c0392b;font-size:12px;margin-top:8px;text-align:center}
.app-wrap{flex:1;display:flex;flex-direction:column;display:none}
.client-bar{background:#fff;border-bottom:1px solid #eee;padding:10px 16px}
.client-bar label{font-size:12px;color:#666}
.client-input{display:flex;gap:8px;margin-top:6px}
.client-input input{flex:1;padding:7px 10px;border:1px solid #ddd;border-radius:8px;font-size:13px;outline:none}
.client-input button{padding:7px 14px;background:#534AB7;color:#fff;border:none;border-radius:8px;font-size:13px;cursor:pointer}
.chat-area{flex:1;overflow-y:auto;padding:12px 16px;display:flex;flex-direction:column;gap:8px;background:#f5f5f5}
.bubble-wrap{display:flex;align-items:flex-end;gap:8px}
.bubble-wrap.sent{flex-direction:row-reverse}
.bubble{max-width:75%;padding:9px 13px;border-radius:16px;font-size:14px;line-height:1.5}
.bubble.sent{background:#534AB7;color:#fff;border-bottom-right-radius:4px}
.bubble.recv{background:#fff;color:#333;border-bottom-left-radius:4px;border:1px solid #eee}
.bubble-time{font-size:10px;color:#999;margin-top:2px;text-align:right}
.sender-name{font-size:10px;color:#999;margin-bottom:2px}
.mini-av{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:600;flex-shrink:0;color:#fff}
.input-bar{background:#fff;border-top:1px solid #eee;padding:10px 16px;display:flex;gap:8px}
.input-bar input{flex:1;padding:9px 14px;border:1px solid #ddd;border-radius:99px;font-size:14px;outline:none}
.input-bar input:focus{border-color:#534AB7}
.send-btn{width:38px;height:38px;border-radius:50%;background:#534AB7;color:#fff;border:none;cursor:pointer;font-size:18px;display:flex;align-items:center;justify-content:center}
.status-dot{width:8px;height:8px;border-radius:50%;background:#4CAF50;display:inline-block;margin-right:4px}
.tab-toggle{display:flex;gap:8px;padding:8px 16px;background:#fff;border-bottom:1px solid #eee}
.tab-toggle button{flex:1;padding:7px;border:1px solid #ddd;border-radius:8px;font-size:12px;cursor:pointer;background:#fff;color:#666}
.tab-toggle button.active{background:#534AB7;color:#fff;border-color:#534AB7}
</style>
</head>
<body>
<div class="header">
  <h1>&#128172; Employee Chat</h1>
  <div class="header-right" id="user-info"></div>
</div>

<div class="login-wrap" id="login-wrap">
  <div class="login-card">
    <h2 id="form-title">Employee Login</h2>
    <p id="form-sub">Sign in to start chatting with clients</p>
    <div id="register-fields" style="display:none">
      <div class="form-group"><label>Full Name</label><input id="reg-name" placeholder="Your name"></div>
      <div class="form-group"><label>Department</label><input id="reg-dept" placeholder="e.g. Sales"></div>
    </div>
    <div class="form-group"><label>Email</label><input id="email" type="email" placeholder="you@company.com"></div>
    <div class="form-group"><label>Password</label><input id="password" type="password" placeholder="••••••••"></div>
    <button class="btn" onclick="submitAuth()">Sign In</button>
    <button class="btn btn-outline" onclick="toggleMode()">Create Account</button>
    <div class="error" id="auth-error"></div>
  </div>
</div>

<div class="app-wrap" id="app-wrap">
  <div class="client-bar">
    <label>Chatting with client:</label>
    <div class="client-input">
      <input id="client-name" placeholder="Enter client name (e.g. Rahul - TechCorp)" />
      <button onclick="setClient()">Set</button>
    </div>
  </div>
  <div class="chat-area" id="chat-area">
    <div style="text-align:center;padding:40px 0;color:#999;font-size:13px">
      Set a client name above to start the conversation
    </div>
  </div>
  <div class="input-bar">
    <input id="msg-input" placeholder="Type a message..." onkeydown="if(event.key==='Enter')sendMessage()" />
    <button class="send-btn" onclick="sendMessage()">&#10148;</button>
  </div>
</div>

<script>
const API = 'http://localhost:5050';
let socket, currentUser, currentClient = null, isRegister = false;

function toggleMode() {
  isRegister = !isRegister;
  document.getElementById('form-title').textContent = isRegister ? 'Create Account' : 'Employee Login';
  document.getElementById('form-sub').textContent = isRegister ? 'Register as an employee' : 'Sign in to start chatting';
  document.getElementById('register-fields').style.display = isRegister ? '' : 'none';
  document.querySelector('.btn').textContent = isRegister ? 'Register' : 'Sign In';
  document.querySelector('.btn-outline').textContent = isRegister ? 'Back to Login' : 'Create Account';
}

async function submitAuth() {
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value.trim();
  const error = document.getElementById('auth-error');
  error.textContent = '';
  if (!email || !password) { error.textContent = 'Please fill all fields'; return; }

  if (isRegister) {
    const name = document.getElementById('reg-name').value.trim();
    const department = document.getElementById('reg-dept').value.trim();
    if (!name) { error.textContent = 'Please enter your name'; return; }
    const res = await fetch(API + '/api/auth/register', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name, email, password, role: 'employee', department })
    });
    const data = await res.json();
    if (!res.ok) { error.textContent = data.message; return; }
    toggleMode();
    error.style.color = 'green';
    error.textContent = 'Account created! Please sign in.';
  } else {
    const res = await fetch(API + '/api/auth/login', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password })
    });
    const data = await res.json();
    if (!res.ok) { error.textContent = data.message; return; }
    currentUser = data.user;
    localStorage.setItem('emp_token', data.token);
    localStorage.setItem('emp_user', JSON.stringify(data.user));
    initApp();
  }
}

function initApp() {
  document.getElementById('login-wrap').style.display = 'none';
  document.getElementById('app-wrap').style.display = 'flex';
  document.getElementById('user-info').innerHTML =
    '<span class="status-dot"></span>' + currentUser.name;

  socket = io(API);
  socket.emit('join', currentUser.id);

  socket.on('receive_message', (msg) => {
    if (currentClient && (msg.senderId === currentUser.id || msg.receiverId === currentUser.id)) {
      renderMessage(msg);
    }
  });
}

function setClient() {
  const name = document.getElementById('client-name').value.trim();
  if (!name) return;
  currentClient = { id: 'client_' + name.replace(/\s/g, '_').toLowerCase(), name };
  document.getElementById('chat-area').innerHTML = '';
  document.getElementById('client-name').value = name;
}

function sendMessage() {
  const input = document.getElementById('msg-input');
  const text = input.value.trim();
  if (!text || !currentClient) {
    if (!currentClient) alert('Please set a client name first');
    return;
  }
  socket.emit('send_message', {
    senderId: currentUser.id,
    senderName: currentUser.name,
    senderRole: 'employee',
    receiverId: currentClient.id,
    receiverName: currentClient.name,
    text
  });
  input.value = '';
}

function renderMessage(msg) {
  const area = document.getElementById('chat-area');
  const isSent = msg.senderId === currentUser.id;
  const colors = ['#534AB7','#1D9E75','#D85A30','#D4537E','#BA7517'];
  const colorIndex = msg.senderName.charCodeAt(0) % colors.length;
  const initials = msg.senderName.split(' ').map(w => w[0]).join('').slice(0, 2).toUpperCase();
  const time = new Date(msg.timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  const div = document.createElement('div');
  div.className = 'bubble-wrap' + (isSent ? ' sent' : '');
  div.innerHTML = `
    <div class="mini-av" style="background:${colors[colorIndex]}">${initials}</div>
    <div>
      <div class="sender-name">${msg.senderName}</div>
      <div class="bubble ${isSent ? 'sent' : 'recv'}">${msg.text}</div>
      <div class="bubble-time">${time}</div>
    </div>`;
  area.appendChild(div);
  area.scrollTop = area.scrollHeight;
}

const saved = localStorage.getItem('emp_user');
if (saved) { currentUser = JSON.parse(saved); initApp(); }
</script>
</body>
</html>
